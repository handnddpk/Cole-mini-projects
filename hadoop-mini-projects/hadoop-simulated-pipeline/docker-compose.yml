version: '3.8'

services:
  # MySQL Source Database
  mysql-source:
    image: mysql:8.0
    hostname: mysql-source
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=hadoop
      - MYSQL_DATABASE=retail_db
      - MYSQL_USER=sqoop
      - MYSQL_PASSWORD=sqoop
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql:/docker-entrypoint-initdb.d
      - ./scripts:/scripts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Hadoop NameNode
  namenode:
    image: apache/hadoop:3.3.6
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"  # NameNode Web UI
      - "8020:8020"  # NameNode RPC
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./scripts:/scripts
      - ./data:/data
    environment:
      - CLUSTER_NAME=hadoop-ecosystem-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Hadoop DataNode
  datanode:
    image: apache/hadoop:3.3.6
    hostname: datanode
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"  # DataNode Web UI
      - "9866:9866"  # DataNode data transfer
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
    depends_on:
      namenode:
        condition: service_healthy

  # Resource Manager
  resourcemanager:
    image: apache/hadoop:3.3.6
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"  # Resource Manager Web UI
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - YARN_CONF_yarn_resourcemanager_hostname=resourcemanager
      - YARN_CONF_yarn_resourcemanager_bind___host=0.0.0.0
    depends_on:
      namenode:
        condition: service_healthy

  # Node Manager
  nodemanager:
    image: apache/hadoop:3.3.6
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    ports:
      - "8042:8042"  # Node Manager Web UI
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - YARN_CONF_yarn_resourcemanager_hostname=resourcemanager
      - YARN_CONF_yarn_nodemanager_bind___host=0.0.0.0
      - YARN_CONF_yarn_nodemanager_aux___services=mapreduce_shuffle
      - YARN_CONF_yarn_nodemanager_aux___services_mapreduce___shuffle_class=org.apache.hadoop.mapred.ShuffleHandler
    depends_on:
      - resourcemanager

  # Apache Hive Metastore Database
  hive-metastore-db:
    image: postgres:13
    hostname: hive-metastore-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=metastore
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
    volumes:
      - hive_metastore_data:/var/lib/postgresql/data

  # Apache Hive Metastore Service
  hive-metastore:
    image: apache/hive:3.1.3
    hostname: hive-metastore
    ports:
      - "9083:9083"  # Metastore Thrift service
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=postgres
      - SERVICE_OPTS=-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hive
    depends_on:
      - hive-metastore-db
      - namenode
    volumes:
      - ./scripts:/scripts

  # Apache Hive Server
  hive-server:
    image: apache/hive:3.1.3
    hostname: hive-server
    ports:
      - "10000:10000"  # HiveServer2 Thrift service
      - "10002:10002"  # HiveServer2 Web UI
    environment:
      - SERVICE_NAME=hiveserver2
      - SERVICE_OPTS=-Dhive.metastore.uris=thrift://hive-metastore:9083
      - IS_RESUME=true
    depends_on:
      - hive-metastore
    volumes:
      - ./scripts:/scripts
      - ./data:/data

  # Apache Pig
  pig:
    image: apache/pig:0.17.0
    hostname: pig
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    depends_on:
      namenode:
        condition: service_healthy
    command: tail -f /dev/null

  # Apache Sqoop
  sqoop:
    image: apache/sqoop:1.4.7
    hostname: sqloop
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    depends_on:
      - namenode
      - mysql-source
    command: tail -f /dev/null

  # Data Generator Service
  data-generator:
    build:
      context: .
      dockerfile: docker/Dockerfile.datagen
    hostname: data-generator
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    environment:
      - MYSQL_HOST=mysql-source
      - MYSQL_USER=root
      - MYSQL_PASSWORD=hadoop
      - MYSQL_DATABASE=retail_db
    depends_on:
      mysql-source:
        condition: service_healthy
    command: tail -f /dev/null

  # Apache Spark (for additional processing)
  spark-master:
    image: bitnami/spark:3.5
    hostname: spark-master
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master port
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - ./scripts:/scripts
    depends_on:
      namenode:
        condition: service_healthy

  spark-worker:
    image: bitnami/spark:3.5
    hostname: spark-worker
    ports:
      - "8081:8081"  # Spark Worker Web UI
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      - ./scripts:/scripts

volumes:
  mysql_data:
  hadoop_namenode:
  hadoop_datanode:
  hive_metastore_data:
