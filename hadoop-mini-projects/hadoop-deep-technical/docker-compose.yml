version: '3.8'

services:
  # MinIO Object Storage Cluster
  minio1:
    image: minio/minio:latest
    hostname: minio1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio1_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_SERVER_URL: http://localhost:9000
    command: server --console-address ":9001" http://minio{1...4}/data{1...2}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio2:
    image: minio/minio:latest
    hostname: minio2
    ports:
      - "9010:9000"
    volumes:
      - minio2_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server --console-address ":9001" http://minio{1...4}/data{1...2}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio3:
    image: minio/minio:latest
    hostname: minio3
    ports:
      - "9020:9000"
    volumes:
      - minio3_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server --console-address ":9001" http://minio{1...4}/data{1...2}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio4:
    image: minio/minio:latest
    hostname: minio4
    ports:
      - "9030:9000"
    volumes:
      - minio4_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server --console-address ":9001" http://minio{1...4}/data{1...2}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # PostgreSQL for Metadata Storage
  postgres-metadata:
    image: postgres:15
    hostname: postgres-metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-metadata-db.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: hdfs_metadata
      POSTGRES_USER: hdfs_admin
      POSTGRES_PASSWORD: hdfs_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdfs_admin -d hdfs_metadata"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Metadata Caching
  redis-cache:
    image: redis:7-alpine
    hostname: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Metadata Service (Primary Instance)
  metadata-service-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.metadata-service
    hostname: metadata-service-1
    ports:
      - "8080:8080"  # REST API
      - "8081:8081"  # gRPC API
      - "8082:8082"  # Management/Health
    volumes:
      - ./src:/workspace/src
      - ./conf:/workspace/conf
      - ./logs:/workspace/logs
    environment:
      # Service Configuration
      SERVICE_INSTANCE_ID: metadata-service-1
      SERVICE_PORT: 8080
      GRPC_PORT: 8081
      MANAGEMENT_PORT: 8082
      
      # Database Configuration
      DB_HOST: postgres-metadata
      DB_PORT: 5432
      DB_NAME: hdfs_metadata
      DB_USER: hdfs_admin
      DB_PASSWORD: hdfs_password
      DB_MAX_CONNECTIONS: 20
      
      # Cache Configuration
      CACHE_HOST: redis-cache
      CACHE_PORT: 6379
      CACHE_TTL_SECONDS: 3600
      CACHE_MAX_MEMORY: 512mb
      
      # MinIO Configuration
      MINIO_ENDPOINTS: http://minio1:9000,http://minio2:9000,http://minio3:9000,http://minio4:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_PREFIX: hdfs-
      
      # Performance Tuning
      JVM_HEAP_SIZE: 2G
      JVM_METASPACE_SIZE: 256M
      ENABLE_JMX: true
      JMX_PORT: 9999
      
      # High Availability
      CLUSTER_MODE: true
      CLUSTER_NODES: metadata-service-1:8081,metadata-service-2:8081
      
    depends_on:
      postgres-metadata:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Metadata Service (Secondary Instance for HA)
  metadata-service-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.metadata-service
    hostname: metadata-service-2
    ports:
      - "8090:8080"  # REST API
      - "8091:8081"  # gRPC API
      - "8092:8082"  # Management/Health
    volumes:
      - ./src:/workspace/src
      - ./conf:/workspace/conf
      - ./logs:/workspace/logs
    environment:
      SERVICE_INSTANCE_ID: metadata-service-2
      SERVICE_PORT: 8080
      GRPC_PORT: 8081
      MANAGEMENT_PORT: 8082
      DB_HOST: postgres-metadata
      DB_PORT: 5432
      DB_NAME: hdfs_metadata
      DB_USER: hdfs_admin
      DB_PASSWORD: hdfs_password
      DB_MAX_CONNECTIONS: 20
      CACHE_HOST: redis-cache
      CACHE_PORT: 6379
      CACHE_TTL_SECONDS: 3600
      CACHE_MAX_MEMORY: 512mb
      MINIO_ENDPOINTS: http://minio1:9000,http://minio2:9000,http://minio3:9000,http://minio4:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_PREFIX: hdfs-
      JVM_HEAP_SIZE: 2G
      JVM_METASPACE_SIZE: 256M
      ENABLE_JMX: true
      JMX_PORT: 9999
      CLUSTER_MODE: true
      CLUSTER_NODES: metadata-service-1:8081,metadata-service-2:8081
    depends_on:
      postgres-metadata:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Load Balancer for Metadata Services
  nginx-lb:
    image: nginx:alpine
    hostname: nginx-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
      - ./conf/ssl:/etc/nginx/ssl
    depends_on:
      - metadata-service-1
      - metadata-service-2

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    hostname: jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
    environment:
      COLLECTOR_OTLP_ENABLED: true

  # Test Client for Load Testing
  test-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.test-client
    hostname: test-client
    volumes:
      - ./scripts:/scripts
      - ./test-data:/test-data
      - ./results:/results
    environment:
      METADATA_SERVICE_URL: http://nginx-lb
      TEST_DURATION_MINUTES: 10
      CONCURRENT_CLIENTS: 100
      OPERATIONS_PER_SECOND: 1000
    depends_on:
      - metadata-service-1
      - metadata-service-2
    profiles:
      - testing

volumes:
  minio1_data:
  minio2_data:
  minio3_data:
  minio4_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
