events {
    worker_connections 1024;
}

http {
    upstream metadata_service {
        least_conn;
        server metadata-service-1:8080 max_fails=3 fail_timeout=30s;
        server metadata-service-2:8080 max_fails=3 fail_timeout=30s;
    }

    upstream metadata_grpc {
        least_conn;
        server metadata-service-1:8081 max_fails=3 fail_timeout=30s;
        server metadata-service-2:8081 max_fails=3 fail_timeout=30s;
    }

    # HTTP API Load Balancer
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # HDFS-compatible REST API
        location /webhdfs/v1 {
            proxy_pass http://metadata_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings for potentially slow operations
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Custom metadata API
        location /api/ {
            proxy_pass http://metadata_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Metrics endpoint
        location /metrics {
            proxy_pass http://metadata_service;
            proxy_set_header Host $host;
        }
    }

    # gRPC Load Balancer
    server {
        listen 8081 http2;
        
        location / {
            grpc_pass grpc://metadata_grpc;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
}
