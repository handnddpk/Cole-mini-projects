# Redis configuration for HDFS metadata caching

# Basic configuration
port 6379
bind 0.0.0.0
protected-mode no

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
save 60 10000

# Persistence
appendonly yes
appendfsync everysec

# Performance tuning for metadata caching
tcp-keepalive 300
tcp-backlog 511
timeout 0
databases 16

# Logging
loglevel notice
logfile ""

# Client timeouts optimized for metadata operations
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Memory optimizations for small objects (metadata)
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Disable some features we don't need for metadata caching
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
